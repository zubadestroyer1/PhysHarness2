# PhysHarness workbench v2: wheels the Debian 20260901T000000Z bookworm snapshot does
# not package. formal/workbench-v2.Dockerfile installs this file with
#   python3 -m pip install --no-deps --require-hashes --only-binary=:all: --target ...
# and then runs `python3 -m pip check`.
#
# STATUS: resolved on 2026-09-25 from PyPI. Each package has one --hash per
# architecture: the cp311-compatible manylinux wheel for aarch64, then x86_64.
#
# Target interpreter: Debian bookworm CPython 3.11 (3.11.2 in the 2026-09-23 build), with
# Debian numpy 1.24.2 and scipy 1.10.1 already installed. Pip never replaces them.
#
# Resolution rule at rebuild:
# - For each package, choose the newest release that ships cp311 manylinux wheels for
#   both aarch64 and x86_64. Its Requires-Dist must be satisfied by the Debian packages
#   in the image (numpy 1.24.2, scipy 1.10.1, ...).
# - Pin `name==version` and add one --hash per architecture wheel.
# - Each Requires-Dist entry must be a Debian package in the image or its own pinned line
#   here. Prefer an apt package (for example python3-jinja2, python3-joblib, python3-cffi
#   or python3-setuptools) when the snapshot has a satisfying version.
# - Resolved dependency edges (from each wheel's METADATA):
#   - cvxpy 1.6.0 is the newest release whose Requires-Dist accepts scipy 1.10.1;
#     1.6.1 and later need scipy>=1.11.0 and 1.8.0 and later need numpy>=2. It needs
#     osqp>=0.6.2, clarabel>=0.5.0 and scs>=3.2.4.post1.
#   - osqp stays on 0.6.x, which needs qdldl (pinned below). cvxpy 1.6.0 maps OSQP 0.6
#     status codes, and osqp 1.x renumbers them: in the preflight, osqp 1.1.3 reported an
#     infeasible QP as infeasible_inaccurate and an unbounded QP as a solver error.
#   - clarabel needs cffi: Debian python3-cffi, installed by the Dockerfile.
#   - python-flint 0.9.0 and clarabel 0.11.1 ship abi3 wheels (cp310-abi3, cp39-abi3).

